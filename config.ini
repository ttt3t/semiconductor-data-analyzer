; Example layout: SN,X,Y,Site,SBIN,HBIN,Wafer,Test1,Test2,...
[File]
Encoding=UTF-8
Delimiter=,
HasQuotedFields=true

[Layout]
TestItemRow=1
LowLimitRow=2
HighLimitRow=3
UnitRow=4
TestNumberRow=5
SBinRow=6
HBinRow=7
DataStartRow=8
TestItemStartColumn=8

[IdentityColumns]
SerialNumberColumn=1
XColumn=2
YColumn=3
SiteColumn=4
; 1-based wafer column; 0 uses the CSV filename.
WaferColumn=7
SBinColumn=5
HBinColumn=6


[Histogram]
BinMode=Fixed
BinCount=40
ShowLowLimit=true
ShowHighLimit=true
ShowMean=true
ShowThreeSigma=true
IncludeOutOfLimitData=true

[Display]
DecimalPlaces=6
MaxTableRows=10000

[Robust]
RemoveOutliers=true
OutlierSigma=6

[SBinCategories]
; 每行：分类名称=SBIN1,SBIN2；取消示例行开头的分号即可启用。
; 坏点=1,2,3
; 坏线=4,5,6
; 未配置的 SBIN 自动显示为未分类。
[HBINClassification]
PassHBins=1
PartialPassHBins=

[PredictionContext]
ProductColumn=0
ProgramColumn=0
LotColumn=0
Product=
Program=
Lot=
NotApplicableTokens=N/A,NA,NOT_APPLICABLE
MissingTokens=NOT_TESTED,SKIP

[ProgramCompatibility]
; CompatibleGroup=ProgramA,ProgramB
